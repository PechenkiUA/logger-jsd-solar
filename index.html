<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Інвертор JSD Solar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --page: #0c0f12;
  --surface: #171b20;
  --raised: #20262d;
  --line: #2a323b;
  --text: #eef2f5;
  --text-2: #b4bec8;
  --muted: #7d8a97;
  /* bright tints for the flow diagram, darker validated steps for chart lines */
  --pv: #f5b83d;       --pv-line: #c98500;
  --battery: #35d6a5;  --battery-line: #199e70;
  --load: #a78bfa;     --load-line: #8f72f0;
  --grid: #5aa9ff;
  --critical: #ef5b5b;
  --display: "Unbounded", system-ui, sans-serif;
  --body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text); font: 15px/1.45 var(--body); }
main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 48px; }
button, input, select { font: inherit; }
:focus-visible { outline: 2px solid var(--grid); outline-offset: 2px; }
[hidden] { display: none !important; }

header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 18px; }
h1 { margin: 0; font: 500 17px var(--display); letter-spacing: 0.01em; }
h2 { margin: 0; font: 500 13px var(--display); letter-spacing: 0.02em; }
.link { display: inline-flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 13px; }
.link i { width: 8px; height: 8px; border-radius: 50%; background: var(--critical); }
.link.ok i { background: var(--battery); box-shadow: 0 0 0 4px rgba(53, 214, 165, 0.16); }
.tabs { margin-left: auto; display: inline-flex; padding: 3px; background: var(--surface); border-radius: 999px; }
.tabs button { border: 0; background: none; color: var(--text-2); padding: 7px 16px; border-radius: 999px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--raised); color: var(--text); }

.card { background: var(--surface); border-radius: 20px; padding: 20px; }
.hero { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 12px; margin-bottom: 12px; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; } }

/* energy flow */
.flow { padding: 12px; display: flex; justify-content: center; }
.flow svg { display: block; width: 100%; max-width: 380px; height: auto; }
.flow text { font-family: var(--body); fill: var(--text); }
.flow .lbl { fill: var(--muted); font-size: 12px; }
.flow .val { font: 500 15px var(--display); }
.node circle { fill: var(--raised); }
.node path, .node line, .node circle.ico { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.node { color: var(--muted); transition: color 0.4s; }
.node.on.pv { color: var(--pv); } .node.on.grid { color: var(--grid); } .node.on.load { color: var(--load); }
.wire { fill: none; stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.pulse { fill: none; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 2 14; opacity: 0; transition: opacity 0.4s; animation: run 1.4s linear infinite; }
.pulse.on { opacity: 1; }
.pulse.pv { stroke: var(--pv); } .pulse.grid { stroke: var(--grid); } .pulse.load { stroke: var(--load); }
@keyframes run { to { stroke-dashoffset: -32; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; stroke-dasharray: none; } }
.ring-track { fill: none; stroke: var(--raised); stroke-width: 12; }
.ring-fill { fill: none; stroke: var(--battery); stroke-width: 12; stroke-linecap: round; transition: stroke-dasharray 0.8s ease; }
.soc { font: 600 44px var(--display); }
.soc-unit { font: 500 16px var(--display); fill: var(--text-2); }
.ring-sub { font-size: 13px; fill: var(--text-2); }
.ring-state { font-size: 12px; fill: var(--battery); }

/* now panel */
.now { display: flex; flex-direction: column; gap: 18px; }
.mode { font: 500 22px/1.2 var(--display); margin-top: 6px; }
.figures { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 420px) { .figures { grid-template-columns: 1fr; } }
.figure { background: var(--raised); border-radius: 14px; padding: 14px; min-width: 0; }
.figure .k { display: flex; align-items: center; gap: 7px; color: var(--text-2); font-size: 13px; }
.figure .k i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.figure .v { margin-top: 8px; font: 500 24px/1 var(--display); white-space: nowrap; }
.figure .v small { font: 400 13px var(--body); color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--load); transition: width 0.6s; }
.bar-head { display: flex; justify-content: space-between; margin-bottom: 7px; color: var(--text-2); font-size: 13px; }
.bar-head b { color: var(--text); font-weight: 500; }
.readings { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 14px 18px; margin: 0; }
.readings dt { color: var(--muted); font-size: 12px; }
.readings dd { margin: 2px 0 0; font-variant-numeric: tabular-nums; }

/* chart */
.chart-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin-bottom: 14px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; padding: 3px; background: var(--raised); border-radius: 999px; }
.seg button, .ghost { border: 0; background: none; color: var(--text-2); padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); }
.ghost { background: var(--raised); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 8px; color: var(--text-2); font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 2px; border-radius: 1px; }
.plot { position: relative; }
.plot svg { display: block; width: 100%; height: 280px; touch-action: pan-y; }
.plot text { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.gridline { stroke: var(--line); stroke-width: 1; }
.baseline { stroke: #3a444f; stroke-width: 1; }
.line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.cross { stroke: #3a444f; stroke-width: 1; }
.dot { stroke: var(--surface); stroke-width: 2; }
.empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.tip { position: absolute; top: 8px; pointer-events: none; min-width: 180px; padding: 10px 12px; background: var(--raised); border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); font-size: 13px; }
.tip .time { color: var(--text-2); margin-bottom: 4px; }
.tip .row { display: flex; align-items: center; gap: 7px; }
.tip .row i { width: 8px; height: 8px; border-radius: 50%; }
.tip .row b { margin-left: auto; padding-left: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
.table-wrap { max-height: 280px; overflow: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { position: sticky; top: 0; background: var(--surface); color: var(--muted); font-weight: 400; }

/* settings */
.warn { margin: 0 0 12px; color: var(--text-2); font-size: 13px; max-width: 70ch; }
.groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; align-items: start; }
.group h2 { margin-bottom: 8px; color: var(--text-2); }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); min-height: 52px; }
.row:first-of-type { border-top: 0; }
.row .name { flex: 1; min-width: 0; color: var(--text-2); font-size: 14px; }
.row .cur { font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .cur.pending { color: var(--muted); font-weight: 400; }
.row.editing { flex-wrap: wrap; }
.row.editing .name { flex-basis: 100%; color: var(--text); }
.edit { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; width: 100%; }
.edit input, .edit select { color: var(--text); background: var(--page); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; }
.edit input { width: 96px; }
.edit .hint { color: var(--muted); font-size: 12px; }
.edit .msg { flex-basis: 100%; color: var(--critical); font-size: 13px; }
.btn { border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer; background: var(--raised); color: var(--text); font-size: 13px; }
.btn.primary { background: var(--battery); color: #06261c; font-weight: 600; }
.btn:disabled { opacity: 0.5; cursor: default; }
.lock { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>JSD Solar J4000HC</h1>
    <span class="link" id="link"><i></i><span></span></span>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="overview">Огляд</button>
      <button role="tab" data-tab="settings">Налаштування</button>
    </div>
  </header>

  <div id="tab-overview">
    <section class="hero">
      <div class="card flow">
        <svg viewBox="0 0 360 430" role="img" aria-label="Схема потоків енергії: панелі та мережа до батареї, батарея до дому">
          <path class="wire" d="M64 136 C64 196 70 236 94 236"/>
          <path class="pulse pv" id="flowPv" d="M64 136 C64 196 70 236 94 236"/>
          <path class="wire" d="M296 136 C296 196 290 236 266 236"/>
          <path class="pulse grid" id="flowGrid" d="M296 136 C296 196 290 236 266 236"/>
          <path class="wire" d="M180 324 V352"/>
          <path class="pulse load" id="flowLoad" d="M180 324 V352"/>

          <g class="node pv" id="nodePv">
            <circle cx="64" cy="52" r="28"/>
            <circle class="ico" cx="64" cy="52" r="6"/>
            <path d="M64 38v4M64 62v4M50 52h4M74 52h4M54.1 42.1l2.8 2.8M71.1 59.1l2.8 2.8M54.1 61.9l2.8-2.8M71.1 44.9l2.8-2.8"/>
          </g>
          <text class="val" x="64" y="104" text-anchor="middle" id="pvW">—</text>
          <text class="lbl" x="64" y="122" text-anchor="middle">Панелі</text>

          <g class="node grid" id="nodeGrid">
            <circle cx="296" cy="52" r="28"/>
            <path d="M299 39l-9 14h7l-3 12 10-15h-7z"/>
          </g>
          <text class="val" x="296" y="104" text-anchor="middle" id="gridV">—</text>
          <text class="lbl" x="296" y="122" text-anchor="middle">Мережа</text>

          <circle class="ring-track" cx="180" cy="236" r="80"/>
          <circle class="ring-fill" id="ring" cx="180" cy="236" r="80" transform="rotate(-90 180 236)" stroke-dasharray="0 503"/>
          <text x="180" y="244" text-anchor="middle"><tspan class="soc" id="soc">—</tspan><tspan class="soc-unit" dx="3">%</tspan></text>
          <text class="ring-sub" x="180" y="268" text-anchor="middle" id="battV">—</text>
          <text class="ring-state" x="180" y="198" text-anchor="middle" id="battState"></text>

          <g class="node load" id="nodeLoad">
            <circle cx="180" cy="384" r="28"/>
            <path d="M168 384l12-11 12 11M171 382v12h18v-12"/>
          </g>
          <text class="val" x="220" y="382" id="loadW">—</text>
          <text class="lbl" x="220" y="400">Дім</text>
        </svg>
      </div>

      <div class="card now">
        <div>
          <h2>Зараз</h2>
          <div class="mode" data-f="mode">—</div>
        </div>
        <div class="figures">
          <div class="figure"><div class="k"><i style="background:var(--load)"></i>Споживання</div><div class="v"><span data-f="out_power_w" data-d="0">—</span> <small>Вт</small></div></div>
          <div class="figure"><div class="k"><i style="background:var(--pv)"></i>Панелі</div><div class="v"><span data-f="pv_power_w" data-d="0">—</span> <small>Вт</small></div></div>
          <div class="figure"><div class="k"><i style="background:var(--battery)"></i>Батарея</div><div class="v"><span data-f="battery_power_w" data-d="0">—</span> <small>Вт</small></div></div>
        </div>
        <div>
          <div class="bar-head"><span>Завантаження інвертора</span><b><span data-f="load_pct" data-d="0">—</span> %</b></div>
          <div class="bar"><i id="loadBar"></i></div>
        </div>
        <dl class="readings">
          <div><dt>Вихід</dt><dd><span data-f="out_voltage_v" data-d="1">—</span> В · <span data-f="out_frequency_hz" data-d="1">—</span> Гц</dd></div>
          <div><dt>Струм виходу</dt><dd><span data-f="out_current_a" data-d="2">—</span> А · <span data-f="out_apparent_va" data-d="0">—</span> ВА</dd></div>
          <div><dt>Мережа</dt><dd><span data-f="grid_voltage_v" data-d="1">—</span> В · <span data-f="grid_frequency_hz" data-d="1">—</span> Гц</dd></div>
          <div><dt>Панелі</dt><dd><span data-f="pv_voltage_v" data-d="1">—</span> В · <span data-f="pv_current_a" data-d="2">—</span> А</dd></div>
          <div><dt>Струм батареї</dt><dd><span data-f="battery_current_a" data-d="1">—</span> А</dd></div>
          <div><dt>Температура</dt><dd><span data-f="temperature_c" data-d="0">—</span> °C</dd></div>
        </dl>
      </div>
    </section>

    <section class="card">
      <div class="chart-head">
        <h2>Потужність, Вт</h2>
        <div class="controls">
          <div class="seg" id="ranges">
            <button data-min="15">15 хв</button>
            <button data-min="60">1 год</button>
            <button data-min="360">6 год</button>
            <button data-min="1440">24 год</button>
          </div>
          <button class="ghost" id="viewToggle">Таблиця</button>
        </div>
      </div>
      <div id="chartView">
        <div class="legend" id="legend"></div>
        <div class="plot">
          <svg id="svg" role="img" aria-label="Графік потужності споживання, панелей та батареї"></svg>
          <div class="empty" id="empty" hidden>За цей період даних ще немає</div>
          <div class="tip" id="tip" hidden></div>
        </div>
      </div>
      <div class="table-wrap" id="tableView" hidden></div>
    </section>
  </div>

  <div id="tab-settings" hidden>
    <p class="warn"><span id="settingsNote"></span> <span id="settingsAge"></span></p>
    <div class="groups" id="groups"></div>
  </div>
</main>

<script>
const SERIES = [
  { key: 'out_power_w', name: 'Споживання', color: 'var(--load-line)' },
  { key: 'pv_power_w', name: 'Панелі', color: 'var(--pv-line)' },
  { key: 'battery_power_w', name: 'Батарея', color: 'var(--battery-line)' },
];
const GROUPS = [
  ['Режими', ['output_priority', 'output_mode', 'charging_priority', 'battery_type', 'charging_method']],
  ['Заряд', ['max_charging_current', 'utility_charging_current', 'cv_voltage', 'float_voltage', 'cv_time', 'cc_max_time']],
  ['Захист батареї', ['discharge_cutoff_voltage', 'discharge_alarm_voltage', 'battery_to_grid_voltage', 'grid_to_battery_voltage', 'battery_overvoltage']],
  ['Мережа', ['grid_overvoltage', 'grid_undervoltage']],
  ['Вирівнювання', ['equalization_voltage', 'equalization_time', 'equalization_timeout', 'equalization_interval']],
  ['BMS', ['soc_shutdown', 'soc_to_grid', 'soc_to_battery']],
];
const STALE_AFTER = 20; // seconds without a reading before the link is shown as down
const FLOW_MIN_W = 5;   // below this a flow line stays idle
const RING = 2 * Math.PI * 80;

const $ = id => document.getElementById(id);
const svg = $('svg'), tip = $('tip');
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
let minutes = Number(store.get('minutes')) || 60;
let rows = [];
let latest = {};
let geom = null;
let settings = [];
let editing = null; // key of the setting being edited; pauses re-rendering of the list
let live = false;   // WebSocket is open

const fmt = (v, digits = 0) => v == null ? '—' : v.toLocaleString('uk-UA', { minimumFractionDigits: digits, maximumFractionDigits: digits });
const clock = (ts, seconds) => new Date(ts * 1000).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit', second: seconds ? '2-digit' : undefined });

async function getJson(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

function renderLink() {
  const age = latest.ts == null ? null : Math.round(Date.now() / 1000 - latest.ts);
  const ok = age != null && age <= STALE_AFTER;
  $('link').className = 'link' + (ok ? ' ok' : '');
  $('link').lastElementChild.textContent = ok ? `На зв'язку · ${age} с тому`
    : age == null ? 'Логер ще не отримав даних' : `Немає зв'язку з ${clock(latest.ts, true)}`;
}

function setFlow(id, watts) {
  const el = $(id), on = watts >= FLOW_MIN_W;
  el.classList.toggle('on', on);
  // more power, faster pulses
  el.style.animationDuration = Math.max(0.45, 1.8 - watts / 1200).toFixed(2) + 's';
  return on;
}

function renderFlow() {
  const d = latest;
  if (d.battery_soc_pct == null) return;
  $('soc').textContent = fmt(d.battery_soc_pct);
  $('ring').setAttribute('stroke-dasharray', `${(RING * Math.min(d.battery_soc_pct, 100) / 100).toFixed(1)} ${RING.toFixed(1)}`);
  $('battV').textContent = fmt(d.battery_voltage_v, 1) + ' В';
  $('pvW').textContent = fmt(d.pv_power_w) + ' Вт';
  $('loadW').textContent = fmt(d.out_power_w) + ' Вт';
  const gridOn = d.grid_voltage_v > 90;
  $('gridV').textContent = gridOn ? fmt(d.grid_voltage_v) + ' В' : 'Немає';
  $('nodePv').classList.toggle('on', setFlow('flowPv', d.pv_power_w));
  $('nodeLoad').classList.toggle('on', setFlow('flowLoad', d.out_power_w));
  $('nodeGrid').classList.toggle('on', gridOn);
  $('flowGrid').classList.toggle('on', gridOn && d.mode === 'Від мережі');
  $('battState').textContent = d.mode === 'Від батареї' && d.out_power_w >= FLOW_MIN_W ? 'живить дім'
    : d.mode === 'Від мережі' && d.battery_current_a > 0 ? 'заряджається' : '';
  $('loadBar').style.width = Math.min(d.load_pct, 100) + '%';
}

function applyReading(data) {
  // a reading can miss fields the inverter garbled: keep the previous values for those
  latest = { ...latest, ...data };
  document.querySelectorAll('[data-f]').forEach(el => {
    const v = data[el.dataset.f];
    if (v != null) el.textContent = typeof v === 'string' ? v : fmt(v, Number(el.dataset.d));
  });
  renderFlow();
  renderLink();
}

async function refreshLatest() {
  try {
    const data = await getJson('/api/latest');
    if (data) applyReading(data);
  } catch (e) { /* logger not running: the link indicator goes stale by itself */ }
  renderLink();
}

// Live updates come over a WebSocket; while it is down the page falls back to polling.
function connectLive() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => { live = true; };
  ws.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'reading') applyReading(msg.data);
    else if (msg.type === 'settings') { settings = msg.data; if (!editing) renderSettings(); }
  };
  ws.onclose = () => { live = false; setTimeout(connectLive, 3000); };
}

async function refreshHistory() {
  try {
    rows = await getJson('/api/history?minutes=' + minutes);
  } catch (e) { return; }
  renderChart();
  renderTable();
}

function niceStep(span, count) {
  const raw = span / count, pow = 10 ** Math.floor(Math.log10(raw));
  return [1, 2, 5, 10].map(m => m * pow).find(s => s >= raw);
}

function renderChart() {
  const W = svg.clientWidth, H = svg.clientHeight;
  if (!W) return; // overview tab is hidden
  const m = { l: 48, r: 12, t: 10, b: 26 };
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  $('empty').hidden = rows.length > 0;
  if (!rows.length) { svg.innerHTML = ''; geom = null; return; }

  const now = Date.now() / 1000, t0 = now - minutes * 60;
  const values = rows.flatMap(r => SERIES.map(s => r[s.key]).filter(v => v != null));
  const step = niceStep(Math.max(Math.max(0, ...values) - Math.min(0, ...values), 10), 4);
  const yMin = Math.floor(Math.min(0, ...values) / step) * step;
  const yMax = Math.max(Math.ceil(Math.max(0, ...values) / step) * step, yMin + step);
  const x = ts => m.l + (ts - t0) / (now - t0) * (W - m.l - m.r);
  const y = v => H - m.b - (v - yMin) / (yMax - yMin) * (H - m.t - m.b);

  let out = '';
  for (let v = yMin; v <= yMax + 1e-9; v += step) {
    out += `<line class="${v === 0 ? 'baseline' : 'gridline'}" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/>`;
    out += `<text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
  }
  for (let i = 0; i <= 5; i++) {
    const ts = t0 + i * minutes / 5 * 60;
    out += `<text x="${x(ts)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === 5 ? 'end' : 'middle'}">${clock(ts)}</text>`;
  }
  // break the line where the logger was offline instead of drawing across the gap
  const gap = Math.max(minutes * 60 / 600, 5) * 4;
  for (const s of SERIES) {
    let d = '', prev = null;
    for (const r of rows) {
      if (r[s.key] == null) continue;
      d += (prev == null || r.ts - prev > gap ? 'M' : 'L') + x(r.ts).toFixed(1) + ' ' + y(r[s.key]).toFixed(1);
      prev = r.ts;
    }
    out += `<path class="line" style="stroke:${s.color}" d="${d}"/>`;
  }
  svg.innerHTML = out + '<g id="hover"></g>';
  geom = { x, y, W, H, m };
}

function renderTable() {
  const head = '<tr><th>Час</th>' + SERIES.map(s => `<th>${s.name}, Вт</th>`).join('') + '</tr>';
  const body = rows.slice().reverse().map(r =>
    `<tr><td>${clock(r.ts, true)}</td>` + SERIES.map(s => `<td>${fmt(r[s.key])}</td>`).join('') + '</tr>').join('');
  $('tableView').innerHTML = `<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

function onHover(ev) {
  if (!geom || !rows.length) return;
  const px = ev.clientX - svg.getBoundingClientRect().left;
  let best = rows[0];
  for (const r of rows) if (Math.abs(geom.x(r.ts) - px) < Math.abs(geom.x(best.ts) - px)) best = r;
  const bx = geom.x(best.ts);
  svg.querySelector('#hover').innerHTML =
    `<line class="cross" x1="${bx}" x2="${bx}" y1="${geom.m.t}" y2="${geom.H - geom.m.b}"/>` +
    SERIES.filter(s => best[s.key] != null).map(s =>
      `<circle class="dot" r="4" cx="${bx}" cy="${geom.y(best[s.key])}" style="fill:${s.color}"/>`).join('');
  tip.innerHTML = `<div class="time">${clock(best.ts, true)}</div>` + SERIES.map(s =>
    `<div class="row"><i style="background:${s.color}"></i>${s.name}<b>${fmt(best[s.key])} Вт</b></div>`).join('');
  tip.hidden = false;
  const left = bx + 14 + tip.offsetWidth > geom.W ? bx - 14 - tip.offsetWidth : bx + 14;
  tip.style.left = Math.max(0, left) + 'px';
}

function clearHover() {
  tip.hidden = true;
  const g = svg.querySelector('#hover');
  if (g) g.innerHTML = '';
}

async function refreshSettings() {
  try {
    settings = await getJson('/api/settings');
  } catch (e) { return; }
  if (!editing) renderSettings();
}

function settingText(s) {
  if (s.raw == null) return '<span class="cur pending">читається…</span>';
  const text = s.type === 'enum' ? (s.options[s.raw] || s.raw) : fmt(s.value, s.step < 1 ? 1 : 0) + ' ' + s.unit;
  return `<span class="cur">${text}</span>`;
}

function settingRow(s) {
  if (editing === s.key) {
    const input = s.type === 'enum'
      ? `<select id="editValue">${Object.entries(s.options).map(([k, v]) => `<option value="${k}"${k === s.raw ? ' selected' : ''}>${v}</option>`).join('')}</select>`
      : `<input id="editValue" type="number" min="${s.min}" max="${s.max}" step="${s.step}" value="${s.value}"><span class="hint">${s.unit}, від ${s.min} до ${s.max}</span>`;
    return `<div class="row editing"><span class="name">${s.title}</span><div class="edit">${input}
      <button class="btn primary" data-save="${s.key}">Записати</button><button class="btn" data-cancel>Скасувати</button>
      <span class="msg" id="editMsg"></span></div></div>`;
  }
  const action = !s.writable ? '<span class="lock">лише перегляд</span>'
    : s.raw == null ? '' : `<button class="btn" data-edit="${s.key}">Змінити</button>`;
  return `<div class="row"><span class="name">${s.title}</span>${settingText(s)}${action}</div>`;
}

function renderSettings() {
  const byKey = Object.fromEntries(settings.map(s => [s.key, s]));
  const read = settings.filter(s => s.raw != null).length;
  $('settingsAge').textContent = read < settings.length ? `Зчитано ${read} з ${settings.length}.` : '';
  $('settingsNote').textContent = settings.some(s => s.writable)
    ? 'Зміна записується в інвертор одразу й перевіряється повторним читанням. Невірні напруги заряду можуть пошкодити батарею — змінюйте лише те, що розумієте.'
    : 'Логер працює в режимі лише моніторингу: налаштування показано для перегляду. Щоб змінювати їх зі сторінки, запустіть його з MODE=control.';
  $('groups').innerHTML = GROUPS.map(([title, keys]) =>
    `<section class="card group"><h2>${title}</h2>${keys.filter(k => byKey[k]).map(k => settingRow(byKey[k])).join('')}</section>`).join('');
}

async function saveSetting(key, button) {
  const s = settings.find(x => x.key === key), el = $('editValue');
  button.disabled = true;
  button.textContent = 'Записую…';
  let result;
  try {
    const res = await fetch('/api/settings', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key, value: s.type === 'enum' ? el.value : Number(el.value) }),
    });
    result = await res.json();
  } catch (e) {
    result = { error: 'Логер не відповідає. Перевірте, чи він запущений.' };
  }
  if (result.error) {
    $('editMsg').textContent = 'Не записано: ' + result.error;
    button.disabled = false;
    button.textContent = 'Записати';
    return;
  }
  editing = null;
  await refreshSettings();
}

function setRange(value) {
  minutes = value;
  store.set('minutes', value);
  document.querySelectorAll('#ranges button').forEach(b => b.setAttribute('aria-pressed', Number(b.dataset.min) === minutes));
  refreshHistory();
}

function setTab(name) {
  store.set('tab', name);
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === name));
  $('tab-overview').hidden = name !== 'overview';
  $('tab-settings').hidden = name !== 'settings';
  if (name === 'overview') renderChart();
}

document.querySelector('.tabs').addEventListener('click', ev => { if (ev.target.dataset.tab) setTab(ev.target.dataset.tab); });
$('groups').addEventListener('click', ev => {
  const t = ev.target;
  if (t.dataset.edit) { editing = t.dataset.edit; renderSettings(); }
  else if ('cancel' in t.dataset) { editing = null; renderSettings(); }
  else if (t.dataset.save) saveSetting(t.dataset.save, t);
});
$('ranges').addEventListener('click', ev => { if (ev.target.dataset.min) setRange(Number(ev.target.dataset.min)); });
$('viewToggle').addEventListener('click', () => {
  const table = $('tableView').hidden;
  $('tableView').hidden = !table;
  $('chartView').hidden = table;
  $('viewToggle').textContent = table ? 'Графік' : 'Таблиця';
  if (!table) renderChart();
});
svg.addEventListener('pointermove', onHover);
svg.addEventListener('pointerleave', clearHover);
window.addEventListener('resize', renderChart);

$('legend').innerHTML = SERIES.map(s => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join('');
setTab(store.get('tab') === 'settings' ? 'settings' : 'overview');
setRange(minutes);
refreshLatest();
refreshSettings();
connectLive();
setInterval(() => live ? renderLink() : refreshLatest(), 2000);
setInterval(refreshHistory, 15000);
setInterval(() => { if (!live) refreshSettings(); }, 15000);
</script>
</body>
</html>
